    <stop offset="0" stop-color="#d7dfcf"/><stop offset=".42" stop-color="#a6b7a0"/><stop offset="1" stop-color="#687f70"/>
  </linearGradient>
  <linearGradient id="haze" x1="0" x2="1"><stop stop-color="#edf0dd" stop-opacity=".65"/><stop offset="1" stop-color="#d7b78f" stop-opacity=".05"/></linearGradient>
  <linearGradient id="tank" x1="0" y1="0" x2="1" y2=".2">
    <stop stop-color="#273a36"/><stop offset=".17" stop-color="#667a70"/><stop offset=".42" stop-color="#344a43"/><stop offset=".74" stop-color="#243a34"/><stop offset="1" stop-color="#182922"/>
  </linearGradient>
  <linearGradient id="tankTop" x1="0" y1="0" x2=".6" y2="1">
    <stop stop-color="#9ba99a"/><stop offset=".35" stop-color="#50645b"/><stop offset="1" stop-color="#293d35"/>
  </linearGradient>
  <linearGradient id="steel" x1="0" x2="1">
    <stop stop-color="#1a2b25"/><stop offset=".25" stop-color="#9baa96"/><stop offset=".44" stop-color="#40564a"/><stop offset=".68" stop-color="#c1c9ae"/><stop offset="1" stop-color="#17271f"/>
  </linearGradient>
  <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#536f5b"/><stop offset="1" stop-color="#1a3026"/>
  </linearGradient>
  <radialGradient id="sunGlow">
    <stop stop-color="#f3dfba" stop-opacity=".9"/><stop offset="1" stop-color="#f3dfba" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="34"/></filter>
  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
