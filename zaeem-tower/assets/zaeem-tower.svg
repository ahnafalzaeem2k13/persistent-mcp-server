<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1200" role="img" aria-labelledby="title desc">
<title id="title">Zaeem Tower — architectural illustration</title>
<desc id="desc">A tall elevated cylindrical water tank supported by a steel frame, rising above a quiet urban skyline at dusk.</desc>
<defs>
